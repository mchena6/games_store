<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games Store API</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #f8f9fa;
            color: #333;
            margin-top: 10%;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn {
            display: inline-block;
            margin: 10px;
            padding: 12px 24px;
            color: white;
            background-color: #007bff;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover { background-color: #0056b3; }
        .btn-dark { background-color: #343a40; }
        .btn-dark:hover { background-color: #23272b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>API REST - Games Store</h1>
        <p>Usa los siguientes enlaces para explorar los endpoints o leer la documentación.</p>
        
        <a href="/api/" class="btn">Explorar API Navegable</a>
        <a href="/api/docs/swagger/" class="btn btn-dark">Documentación Swagger</a>
        <a href="/api/docs/redoc/" class="btn btn-dark">Documentación ReDoc</a>
    </div>
</body>
</html>
