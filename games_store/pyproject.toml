[project]
name = "games-store"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mchena", email = "m.chena@itecriocuarto.org.ar" }
]
requires-python = ">=3.12"
dependencies = [
    "cloudinary>=1.46.3",
    "django>=6.1.2",
    "django-cloudinary-storage>=0.3.0",
    "django-filter>=26.2",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "whitenoise>=6.12.0",
]

[project.scripts]
games-store = "games_store:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
